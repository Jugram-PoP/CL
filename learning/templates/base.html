<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">

    <title>{% block title %}CyberLearn{% endblock %}</title>

    <style>
        :root {
            --bg-dark: #0D0F12;
            --card-bg: #161A20;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F0F4F8;
            --text-muted: #8E9BAE;
            --neon-red: #FF2B4A;
            --neon-cyan: #00F0FF;
            --teal: #0F6E64;
            --coral: #FF6B4A;
            --paper: #F1F7F5;
            --ink: #1B3A36;
            --muted: #5B7A75;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg-dark);
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0D0F12 linear-gradient(to bottom, rgba(13, 15, 18, 0.72) 0%, rgba(13, 15, 18, 0.9) 100%),
            url("{% static 'learning/img/deephacking-wallpaper-4k.jpg' %}") no-repeat center top fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 20, 25, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px 32px;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #FFFFFF;
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: color 0.15s ease;
        }

        .nav-brand:hover {
            color: var(--neon-cyan);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-left: auto;
        }

        .nav-email {
            font-size: 13px;
            color: var(--text-muted);
        }

        .nav-logout-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-logout-btn:hover {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        main.full-width {
            max-width: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-links">
            <a href="/learning/" class="nav-brand">CyberLearn</a>
            {% if user.is_authenticated %}
            <a href="/lessons/">Lessons</a>
            <a href="/simulation/">Simulation</a>
            <a href="{% url 'learning:progress' %}">Progress</a>
            {% endif %}
        </div>

        <div class="nav-right">
            {% if user.is_authenticated %}
            <span class="nav-email">{{ user.email }}</span>
            <form method="post" action="{% url 'accounts:logout' %}" style="margin:0; display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-logout-btn">Log Out</button>
            </form>
            {% else %}
            <a href="{% url 'accounts:login' %}">Log In</a>
            <a href="{% url 'accounts:signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
