<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .lesson-content h2 {
            margin-top: 28px;
            font-size: 1.4rem;
        }

        .lesson-content h3 {
            margin-top: 22px;
            font-size: 1.2rem;
        }

        .lesson-content h4,
        .lesson-content h5 {
            margin-top: 16px;
            font-size: 1.05rem;
        }

        .lesson-content ul {
            padding-left: 22px;
        }

        .lesson-content li {
            margin-bottom: 4px;
        }

        .lesson-content blockquote {
            border-left: 3px solid #6366f1;
            background: #f8f8ff;
            margin: 14px 0;
            padding: 8px 16px;
            font-style: italic;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CyberLearn{% endblock %}</title>
</head>

<body>

    <nav>
        <a href="/">CyberLearn</a>

        {% if user.is_authenticated %}
        <a href="/lessons/">Lessons</a>
        <a href="/simulation/">Simulation</a>
        <div style="text-align: right;">
            <span style="color: red; display:block;">{{ user.email }}</span>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Log Out</button>
            </form>
        </div>
        {% else %}
        <a href="{% url 'accounts:login' %}">Log In</a>
        <a href="{% url 'accounts:signup' %}">Sign Up</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
